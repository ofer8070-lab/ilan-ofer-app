<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#145b9b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="דיבור"><link rel="manifest" href="./manifest.webmanifest"><title>דיבור</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:#1d3451;font:17px system-ui,-apple-system,Arial,sans-serif}main{max-width:650px;margin:auto;padding:24px 16px 90px}h1{text-align:center;margin:8px 0 4px;font-size:29px}.sub{text-align:center;color:#6e8197;margin:0 0 30px}.center{display:flex;flex-direction:column;align-items:center;gap:15px;margin:25px auto}.mic{width:210px;height:210px;border-radius:50%;border:9px solid #d6e9fb;background:linear-gradient(140deg,#2277c5,#12518c);color:white;font-size:28px;font-weight:800;box-shadow:0 12px 30px #2464a640;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer}.mic span{font-size:60px}.mic.active{background:linear-gradient(140deg,#d74c4c,#ad2424);border-color:#f7caca;animation:pulse 1.6s infinite}@keyframes pulse{50%{box-shadow:0 0 0 16px #e13d3d20}}.status{text-align:center;font-size:15px;color:#57728e;min-height:42px}.card{background:white;border-radius:19px;padding:18px;margin-top:18px;box-shadow:0 4px 20px #1b518012}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}button{font:inherit;cursor:pointer}button.small{border:0;border-radius:11px;background:#e7f0fc;color:#1c5790;padding:9px 13px;font-weight:700}button.primary{background:#206fb5;color:white}.date{font-size:14px;color:#70849c}.text{width:100%;min-height:190px;resize:vertical;margin-top:13px;border:1px solid #d8e3f0;border-radius:12px;padding:13px;font:18px/1.65 system-ui,Arial;background:#fcfdff;direction:rtl}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hint{font-size:13px;line-height:1.6;color:#7d8fa4}.saved{border:1px solid #f1b6b6;background:#fff0f0;border-radius:14px;padding:14px;margin:10px 0;color:#842525}.saved.completed{background:#e8f8ec;border-color:#a6dfb5;color:#176638}.saved .date{color:inherit;opacity:.8}.saved .check{display:flex;align-items:center;gap:8px;font-weight:700}.saved .check input{width:23px;height:23px;accent-color:#219653}.saved.completed p{text-decoration:none}.saved p{white-space:pre-wrap;line-height:1.5;margin:8px 0}.saved:last-child{border:0}.empty{color:#8192a6;text-align:center;padding:20px}</style></head><body><main><h1>🎙️ הדיבור שלי</h1><p class="sub">לוחצים, מדברים, והדברים נשמרים בכתב</p><div class="center"><button id="mic" class="mic"><span>🎙️</span><strong id="micLabel">התחל לדבר</strong></button><div id="status" class="status">לחץ על הכפתור הגדול כדי להתחיל</div></div><section class="card"><div class="row"><strong>השיחה הנוכחית</strong><span id="started" class="date">טרם נפתחה שיחה</span></div><textarea id="transcript" class="text" placeholder="כל מה שתגיד יופיע כאן. אפשר גם ללחוץ על 🎙️ במקלדת האייפון כדי להכתיב." spellcheck="true"></textarea><div class="actions"><button id="save" class="small primary">💾 שמור שיחה</button><button id="new" class="small">+ שיחה חדשה</button><button id="copy" class="small">העתק טקסט</button></div><p class="hint">אם המיקרופון באתר אינו נתמך באייפון: לחץ בתוך שדה הטקסט והפעל את המיקרופון של מקלדת האייפון. ההכתבה תופיע באותו מקום. השיחות נשמרות במכשיר הזה בלבד.</p></section><section class="card"><div class="row"><strong>שיחות שמורות</strong><button id="backup" class="small">גיבוי</button></div><div id="history"></div></section></main><script>
const $=id=>document.getElementById(id),KEY='ofer_speech_notes_v1';let notes=[];try{notes=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(notes))notes=[]}catch{}let session=null,rec=null,active=false,finalText='';const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const fmt=iso=>new Date(iso).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});function persist(){localStorage.setItem(KEY,JSON.stringify(notes))}function begin(){if(!session){session={id:String(Date.now())+Math.random(),started:new Date().toISOString()};$('started').textContent='נפתחה: '+fmt(session.started)}}function status(s){$('status').textContent=s}function stop(){active=false;if(rec){try{rec.stop()}catch{}}$('mic').classList.remove('active');$('micLabel').textContent='המשך לדבר'}function listen(){begin();if(!SR){status('זיהוי דיבור ישיר אינו נתמך כאן. לחץ בשדה הטקסט ואז על 🎙️ במקלדת האייפון.');$('transcript').focus();return}if(active){stop();status('ההקלטה נעצרה. אפשר לשמור את השיחה.');return}rec=new SR();rec.lang='he-IL';rec.continuous=true;rec.interimResults=true;finalText=$('transcript').value.trim();if(finalText)finalText+=' ';rec.onresult=e=>{let finals='',interim='';for(let i=0;i<e.results.length;i++){if(e.results[i].isFinal)finals+=e.results[i][0].transcript+' ';else interim+=e.results[i][0].transcript} $('transcript').value=finalText+finals+interim;if(finals){finalText+=finals;$('transcript').value=finalText} };rec.onerror=e=>{active=false;$('mic').classList.remove('active');$('micLabel').textContent='התחל לדבר';status(e.error==='not-allowed'?'המיקרופון נחסם. אפשר להשתמש במיקרופון של מקלדת האייפון.':'הדיבור הופסק ('+e.error+'). נסה שוב או השתמש במיקרופון שבמקלדת.')};rec.onend=()=>{active=false;$('mic').classList.remove('active');$('micLabel').textContent='המשך לדבר';if($('status').textContent.startsWith('🔴'))status('ההכתבה הסתיימה. אפשר להמשיך או לשמור.')};try{rec.start();active=true;$('mic').classList.add('active');$('micLabel').textContent='עצור דיבור';status('🔴 מקשיב לך...')}catch{status('לא ניתן לפתוח את המיקרופון. השתמש בהכתבה במקלדת האייפון.')}}
$('mic').onclick=listen;$('transcript').addEventListener('focus',begin);function save(){begin();const text=$('transcript').value.trim();if(!text){status('אין עדיין טקסט לשמירה');return false}const found=notes.findIndex(n=>n.id===session.id),entry={...session,text,done:found>=0?!!notes[found].done:false};if(found>=0)notes[found]=entry;else notes.unshift(entry);persist();draw();status('✅ השיחה נשמרה');return true}$('save').onclick=()=>{stop();save()};$('new').onclick=()=>{stop();if($('transcript').value.trim()&&!notes.some(n=>n.id===session?.id&&n.text===$('transcript').value.trim())&&!confirm('לפתוח שיחה חדשה בלי לשמור את הטקסט הנוכחי?'))return;session=null;finalText='';$('transcript').value='';$('started').textContent='טרם נפתחה שיחה';$('micLabel').textContent='התחל לדבר';status('שיחה חדשה מוכנה')};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('transcript').value);status('הטקסט הועתק')}catch{$('transcript').select();document.execCommand('copy');status('הטקסט הועתק')}};function draw(){$('history').innerHTML='';if(!notes.length){$('history').innerHTML='<div class="empty">עדיין אין שיחות שמורות</div>';return}notes.forEach(n=>{const el=document.createElement('div');el.className='saved'+(n.done?' completed':'');const check=document.createElement('label');check.className='check';const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!n.done;const checkText=document.createElement('span');checkText.textContent=n.done?'בוצע':'ממתין לביצוע';cb.onchange=()=>{n.done=cb.checked;persist();draw()};check.append(cb,checkText);el.append(check);const date=document.createElement('div');date.className='date';date.textContent='🕒 '+fmt(n.started);const p=document.createElement('p');p.textContent=n.text;const a=document.createElement('div');a.className='actions';const speak=document.createElement('button');speak.className='small';speak.textContent='🔊 השמע';speak.onclick=()=>{if(!('speechSynthesis' in window)){status('השמעת טקסט אינה נתמכת במכשיר זה');return}if(speechSynthesis.speaking){speechSynthesis.cancel();document.querySelectorAll('.speak-active').forEach(b=>{b.textContent='🔊 השמע';b.classList.remove('speak-active')});if(speak.dataset.playing==='yes'){speak.dataset.playing='no';return}}const u=new SpeechSynthesisUtterance(n.text);u.lang='he-IL';u.rate=0.92;const voices=speechSynthesis.getVoices();const hebrew=voices.find(v=>v.lang.toLowerCase()==='he-il')||voices.find(v=>v.lang.toLowerCase().startsWith('he'));if(hebrew)u.voice=hebrew;u.onend=u.onerror=()=>{speak.textContent='🔊 השמע';speak.classList.remove('speak-active');speak.dataset.playing='no'};speak.textContent='⏹ עצור';speak.classList.add('speak-active');speak.dataset.playing='yes';speechSynthesis.speak(u)};const open=document.createElement('button');open.className='small';open.textContent='פתח וערוך';open.onclick=()=>{stop();session={id:n.id,started:n.started};$('started').textContent='נפתחה: '+fmt(n.started);$('transcript').value=n.text;finalText=n.text;window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.className='small';del.textContent='מחק';del.onclick=()=>{if(confirm('למחוק את השיחה?')){notes=notes.filter(x=>x.id!==n.id);persist();draw()}};a.append(speak,open,del);el.append(date,p,a);$('history').append(el)})}$('backup').onclick=()=>{const b=new Blob([JSON.stringify(notes,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='speech-notes-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};draw();
</script></body></html>
