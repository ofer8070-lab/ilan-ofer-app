<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a43"><title>מחשבון מזומנים</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#102a43;font-family:Arial,sans-serif}main{max-width:540px;margin:auto;padding:24px 16px 48px}h1{text-align:center;font-size:28px;margin:10px 0 6px}p{text-align:center;color:#64748b;margin:0 0 24px}.item{display:grid;grid-template-columns:95px 1fr 115px;align-items:center;gap:10px;background:white;border-radius:14px;padding:13px;margin:10px 0;box-shadow:0 2px 8px #102a4310}.denom{font-size:22px;font-weight:700}.item input{width:100%;min-width:0;font-size:23px;padding:11px 8px;border:1px solid #cbd5e1;border-radius:9px;text-align:center;direction:ltr}.sum{text-align:left;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}.coins{grid-template-columns:95px 1fr 115px}.coins .denom{font-size:17px}.total{background:#102a43;color:white;border-radius:18px;padding:23px;margin-top:22px;text-align:center}.total span{font-size:16px}.total strong{display:block;font-size:42px;margin-top:8px;direction:ltr}button{width:100%;background:white;color:#b91c1c;border:2px solid #fecaca;padding:15px;border-radius:12px;font-size:19px;font-weight:bold;margin-top:18px}small{display:block;text-align:center;color:#64748b;margin-top:16px}@media(max-width:380px){.item{grid-template-columns:76px 1fr 90px;gap:7px}.denom{font-size:19px}.sum{font-size:17px}.item input{font-size:20px}}</style></head>
<body><main><h1>💵 מחשבון מזומנים</h1><p>הכנס כמות לכל סוג שטר</p><div id="rows"></div><section class="item coins"><label class="denom" for="coins">מצלצלים</label><input id="coins" type="text" inputmode="decimal" placeholder="סכום ₪" aria-label="סכום מטבעות בשקלים"><output class="sum" id="coinsSum">0 ₪</output></section><section class="total" aria-live="polite"><span>סך הכול מזומנים</span><strong id="total">0 ₪</strong></section><button id="reset" type="button">איפוס המחשבון</button><small>החישוב מתעדכן אוטומטית</small></main>
<script>
const rows=document.getElementById('rows'),format=n=>new Intl.NumberFormat('he-IL',{maximumFractionDigits:2}).format(n)+' ₪';
for(const value of [200,100,50,20]){const div=document.createElement('div');div.className='item';div.innerHTML='<label class="denom" for="n'+value+'">'+value+' ₪</label><input id="n'+value+'" type="number" min="0" step="1" inputmode="numeric" placeholder="כמות" aria-label="כמות שטרות '+value+'"><output class="sum" id="s'+value+'">0 ₪</output>';rows.appendChild(div)}
function calc(){let total=0;for(const v of [200,100,50,20]){const raw=document.getElementById('n'+v).value;const count=raw===''?0:Number(raw);const subtotal=Number.isInteger(count)&&count>=0?count*v:0;document.getElementById('s'+v).textContent=format(subtotal);total+=subtotal}const raw=document.getElementById('coins').value.replace(',','.');const coins=Number(raw);const valid=raw===''?0:(Number.isFinite(coins)&&coins>=0?Math.round(coins*100)/100:0);document.getElementById('coinsSum').textContent=format(valid);document.getElementById('total').textContent=format(total+valid)}
document.querySelectorAll('input').forEach(i=>i.addEventListener('input',calc));document.getElementById('reset').addEventListener('click',()=>{document.querySelectorAll('input').forEach(i=>i.value='');calc()});calc();
</script></body></html>
