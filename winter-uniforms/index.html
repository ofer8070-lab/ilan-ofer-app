<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>הזמנת מדי חורף</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eff6f0;color:#19372b;font:15px Arial,sans-serif}main{max-width:780px;margin:auto;padding:12px}.panel{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 12px #0001}h1{font-size:23px;text-align:center;margin:10px 0 16px}h2{font-size:18px;margin:8px 0 12px}.tabs{display:flex;gap:8px}.tabs button{flex:1}button,input,select{font:inherit}button{background:#167d48;color:#fff;border:0;border-radius:9px;padding:11px;cursor:pointer}button.secondary{background:#e5eee7;color:#17442e}button:disabled{opacity:.5}input[type=text],input[type=password],select{width:100%;padding:11px;border:1px solid #b5c8bb;border-radius:9px;background:#fff;margin:6px 0 12px}label{font-weight:bold}.sizes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:7px 0 14px}.size{padding:10px 2px;background:#f2f6f3;color:#264333;border:1px solid #d3dfd6;font-size:13px}.size.active{background:#167d48;color:white;border-color:#167d48}.item-title{font-weight:bold;margin-top:13px}.msg{font-weight:bold;min-height:20px}.ok{color:#087943}.err{color:#b22}.hidden{display:none}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.card{background:#eaf3ed;border-radius:8px;padding:7px 2px;text-align:center;font-size:11px}.card b{display:block;font-size:19px;margin-top:4px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px;text-align:center}th,td{padding:6px 3px;border-bottom:1px solid #e5ebe7;white-space:nowrap}th{background:#eef5f0}td:first-child,th:first-child{text-align:right}.compact{font-size:12px;color:#65766a}.toolbar{display:flex;gap:6px;flex-wrap:wrap}.toolbar button{font-size:12px;padding:8px}.tiny{font-size:12px}.sub{font-size:12px;color:#52675a;margin:5px 0 12px}#login{max-width:380px} 
</style></head><body><main><h1>הזמנת מדי חורף</h1><div class="tabs"><button id="workerTab">טופס עובד</button><button class="secondary" id="managerTab">מסך מנהל</button></div>
<section id="worker" class="panel"><label for="station">תחנה</label><select id="station"></select><label for="employee">שם העובד</label><input id="employee" type="text" autocomplete="name" placeholder="שם מלא">
<div id="items"></div><button id="send" style="width:100%">שליחת הזמנה</button><p id="workerMsg" class="msg" role="status"></p><p class="sub">אפשר לבחור מידה אחת לכל פריט. פריט ללא מידה לא יוזמן.</p></section>
<section id="manager" class="hidden"><div class="panel" id="login"><h2>כניסת מנהל</h2><button id="google">כניסה עם Google</button><p class="sub" id="authMsg">הדוחות זמינים למנהל מורשה בלבד</p></div>
<div id="dashboard" class="hidden"><div class="panel"><div class="toolbar"><button id="refresh">רענון</button><button id="export">ייצוא CSV לאקסל</button><button id="logout" class="secondary">התנתקות</button></div><div class="filters"><div><label class="tiny">תחנה</label><select id="filterStation"></select></div><div><label class="tiny">חיפוש עובד</label><input id="filterName" type="text" placeholder="שם"></div></div><div id="stats" class="cards"></div><h2>סיכום מידות</h2><div id="sizeSummary" class="scroll"></div><h2>הזמנות עובדים</h2><div id="orders" class="scroll"></div><p class="sub" id="managerMsg"></p></div><div class="panel"><h2>ניהול תחנות</h2><div class="toolbar"><input id="newStation" type="text" placeholder="שם תחנה חדשה" style="flex:1;margin:0"><button id="addStation">הוסף תחנה</button></div><p class="sub">תחנות חדשות יופיעו גם בטופס העובד.</p></div></div></section></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInAnonymously,onAuthStateChanged,signOut,setPersistence,inMemoryPersistence} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';
import {getFirestore,collection,doc,addDoc,getDocs,setDoc,serverTimestamp,query,orderBy} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';
const config={"apiKey":"AIzaSyBptu4EVeypaCiGRDA4PRf8lh7AaQXbR4c","authDomain":"dalton-employees.firebaseapp.com","projectId":"dalton-employees","storageBucket":"dalton-employees.firebasestorage.app","messagingSenderId":"66433309569","appId":"1:66433309569:web:0ae8654c6a8376b080a680","measurementId":"G-J44CSVN3VJ"};
const MANAGER_UID='kv3VMdgMRFYScVLiET9oX0bwVhB2';
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);
const workerApp=initializeApp(config,'winter-worker'),workerAuth=getAuth(workerApp),workerDb=getFirestore(workerApp);
const $=id=>document.getElementById(id);
const itemDefs=[['shirt','חולצת חורף',['XXL','XL','L','M','S']],['coat','מעיל חורף',['XXL','XL','L','M','S']],['overall','חרמונית',['XXL','XL','L','M','S']],['shoes','נעלי עבודה',['41','42','43','44','45']]];
const selections={},defaultStations=['ענבים','מנדלבאום'];let stations=[...defaultStations],allOrders=[],managerReady=false;
function setMessage(id,message,ok){$(id).textContent=message;$(id).className='msg '+(ok?'ok':'err')}
function renderItems(){const root=$('items');root.replaceChildren();for(const [key,label,sizes] of itemDefs){const title=document.createElement('div');title.className='item-title';title.textContent=label;root.append(title);const group=document.createElement('div');group.className='sizes';for(const size of sizes){const b=document.createElement('button');b.type='button';b.className='size'+(selections[key]===size?' active':'');b.textContent=(selections[key]===size?'☑ ':'☐ ')+size;b.onclick=()=>{selections[key]=selections[key]===size?'':size;renderItems()};group.append(b)}root.append(group)}}
function updateStations(){const previous=$('station').value,filtered=$('filterStation').value;for(const id of ['station','filterStation']){$(id).replaceChildren();if(id==='filterStation')$(id).add(new Option('כל התחנות',''));for(const s of stations)$(id).add(new Option(s,s))}if(stations.includes(previous))$('station').value=previous;$('filterStation').value=filtered&&stations.includes(filtered)?filtered:''}
async function loadStations(){try{const snap=await getDocs(collection(db,'winter-stations'));const found=snap.docs.map(d=>d.data().name).filter(v=>typeof v==='string'&&v.trim());stations=[...new Set([...defaultStations,...found])];updateStations()}catch(e){console.warn('Stations load:',e.code);updateStations()}}
renderItems();updateStations();loadStations();
$('workerTab').onclick=()=>{$('worker').classList.remove('hidden');$('manager').classList.add('hidden')};
$('managerTab').onclick=()=>{$('worker').classList.add('hidden');$('manager').classList.remove('hidden');if(managerReady)loadOrders()};
$('send').onclick=async()=>{const name=$('employee').value.trim(),station=$('station').value;const items=Object.fromEntries(itemDefs.map(([key])=>[key,selections[key]||'']));if(!name||!station){setMessage('workerMsg','יש לבחור תחנה ולהכניס שם עובד',false);return}if(!Object.values(items).some(Boolean)){setMessage('workerMsg','יש לבחור לפחות פריט אחד',false);return}if(!confirm('לשלוח הזמנה עבור '+name+' מתחנת '+station+'?'))return;$('send').disabled=true;setMessage('workerMsg','שומר את ההזמנה...',true);try{await setPersistence(workerAuth,inMemoryPersistence);if(!workerAuth.currentUser)await signInAnonymously(workerAuth);await addDoc(collection(workerDb,'winter-orders'),{name,station,...items,createdAt:serverTimestamp()});setMessage('workerMsg','ההזמנה נשמרה בהצלחה בענן',true);$('employee').value='';for(const key of Object.keys(selections))delete selections[key];renderItems()}catch(e){setMessage('workerMsg','השמירה נכשלה: '+(e.code||e.message),false)}finally{$('send').disabled=false}};
onAuthStateChanged(auth,user=>{managerReady=!!user&&user.uid===MANAGER_UID;$('dashboard').classList.toggle('hidden',!managerReady);$('login').classList.toggle('hidden',managerReady);$('authMsg').textContent=user&&!managerReady?'החשבון הזה אינו מורשה כמנהל':'הדוחות זמינים למנהל מורשה בלבד';if(managerReady)loadOrders()});
$('google').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$('authMsg').textContent='ההתחברות נכשלה: '+(e.code||e.message)}};
$('logout').onclick=()=>signOut(auth);
$('refresh').onclick=()=>{loadStations();loadOrders()};
$('filterStation').onchange=renderReport;$('filterName').oninput=renderReport;
function selectedOrders(){const st=$('filterStation').value,q=$('filterName').value.trim();return allOrders.filter(o=>(!st||o.station===st)&&(!q||String(o.name||'').includes(q)))}
function cell(tr,v,tag='td'){const el=document.createElement(tag);el.textContent=String(v??'');tr.append(el)}
function makeTable(headers,rows){const t=document.createElement('table'),head=t.createTHead().insertRow();headers.forEach(h=>cell(head,h,'th'));const body=t.createTBody();rows.forEach(r=>{const tr=body.insertRow();r.forEach(v=>cell(tr,v))});return t}
function renderReport(){if(!managerReady)return;const data=selectedOrders(),stat=$('stats');stat.replaceChildren();for(const [label,n] of [['הזמנות',data.length],...itemDefs.slice(0,3).map(([key,label])=>[label,data.filter(o=>o[key]).length])]){const d=document.createElement('div');d.className='card';d.textContent=label;const b=document.createElement('b');b.textContent=n;d.append(b);stat.append(d)}
const sum=$('sizeSummary');sum.replaceChildren();sum.append(makeTable(['פריט','S','M','L','XL','XXL'],itemDefs.slice(0,3).map(([key,label])=>[label,...['S','M','L','XL','XXL'].map(size=>data.filter(o=>o[key]===size).length||'-')])));
const shoe=document.createElement('p');shoe.className='compact';shoe.textContent='נעלי עבודה: '+['41','42','43','44','45'].map(s=>s+': '+data.filter(o=>o.shoes===s).length).join('  |  ');sum.append(shoe);
const out=$('orders');out.replaceChildren();out.append(makeTable(['עובד','תחנה','חולצה','מעיל','חרמונית','נעליים','תאריך'],data.map(o=>[o.name,o.station,o.shirt||'-',o.coat||'-',o.overall||'-',o.shoes||'-',o.createdAt?.toDate?o.createdAt.toDate().toLocaleDateString('he-IL'):'-'])));$('managerMsg').textContent='מוצגות '+data.length+' הזמנות. אם עובד שלח יותר מהזמנה אחת, כל אחת מופיעה בנפרד.'}
async function loadOrders(){if(!managerReady)return;$('managerMsg').textContent='טוען נתונים...';try{const snap=await getDocs(collection(db,'winter-orders'));allOrders=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));renderReport()}catch(e){$('managerMsg').textContent='שגיאת קריאה: '+(e.code||e.message)}}
$('addStation').onclick=async()=>{const s=$('newStation').value.trim();if(!s)return;if(stations.includes(s)){alert('התחנה כבר קיימת');return}try{await setDoc(doc(db,'winter-stations',s),{name:s});stations.push(s);updateStations();$('newStation').value='';alert('התחנה נוספה')}catch(e){alert('לא ניתן להוסיף תחנה: '+(e.code||e.message))}};
$('export').onclick=()=>{const rows=[['שם העובד','תחנה','חולצת חורף','מעיל חורף','חרמונית','נעלי עבודה','תאריך'],...selectedOrders().map(o=>[o.name,o.station,o.shirt||'',o.coat||'',o.overall||'',o.shoes||'',o.createdAt?.toDate?o.createdAt.toDate().toLocaleString('he-IL'):''])];const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='winter-uniform-orders.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
</script></body></html>
