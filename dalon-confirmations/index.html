<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>אישור עובדים - דור אלון</title><style>body{font-family:Arial,sans-serif;background:#f0f7f2;margin:0;padding:20px;color:#19362b}main{max-width:480px;margin:auto;background:white;border-radius:18px;padding:24px;box-shadow:0 4px 20px #0001}h1{text-align:center;font-size:25px}p{line-height:1.6}select,button{font:inherit;width:100%;padding:14px;border-radius:10px;margin:12px 0}select{border:1px solid #aaa}button{border:0;background:#167d48;color:white;font-weight:bold}button:disabled{background:#aaa}label{display:flex;gap:10px;align-items:center}input{width:22px;height:22px}small{color:#666}.hidden{display:none}.row{padding:12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.yes{color:green}.no{color:#b33}.pattern{position:relative;touch-action:none;overscroll-behavior:contain;-webkit-user-select:none;-webkit-touch-callout:none;width:240px;height:240px;margin:20px auto;display:grid;grid-template-columns:repeat(3,1fr);place-items:center;user-select:none}.dot{width:23px;height:23px;background:#9aaca4;border-radius:50%;z-index:1}.dot.active{background:#167d48;box-shadow:0 0 0 8px #167d4833}.pattern svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.pattern line{stroke:#167d48;stroke-width:5;stroke-linecap:round}.notice{font-size:12px;color:#76633b}a{color:#167d48}</style></head><body><main><h1>אישור הורדת אפליקציית דור אלון</h1><section id="worker"><p>כל העובדים מחויבים להוריד את אפליקציית "דור אלון" לטלפון הנייד ולאשר את ביצוע ההורדה.</p><label for="name">שם העובד</label><select id="name"><option value="">בחר שם</option></select><label><input id="check" type="checkbox">אני מאשר/ת שהורדתי את האפליקציה</label><button id="send">בוצע - שליחת אישור</button><p id="message" role="status"></p></section><section id="lock" class="hidden"><h2 id="locktitle">כניסת מנהל</h2><p id="lockhint">צייר תבנית על תשע הנקודות</p><div id="pattern" class="pattern"><svg id="lines" viewBox="0 0 240 240"></svg></div><p id="lockmsg" role="status"></p><p class="notice">נעילה מקומית למכשיר זה בלבד. אינה מחליפה אימות מאובטח בשרת.</p></section><section id="manager" class="hidden"><h2>מסך מנהל</h2><p id="summary"></p><div id="rows"></div><button id="refresh">רענון</button></section><p><small><a href="?manager=1">כניסה למסך מנהל</a></small></p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
import {getFirestore,doc,setDoc,getDocs,collection,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';
const names=['סופיאן','נביל','עסב','קווינד','זיאד','שאהר','ענתר','מודי'];
const config=null; // REQUIRED: configure Firebase project before use
const db=config?getFirestore(initializeApp(config)):null;
const el=id=>document.getElementById(id);
names.forEach(n=>{let o=document.createElement('option');o.value=n;o.textContent=n;el('name').append(o)});
if(new URLSearchParams(location.search).has('manager')){el('worker').classList.add('hidden');el('lock').classList.remove('hidden');setupLock();}
el('send').onclick=async()=>{const n=el('name').value;if(!n||!el('check').checked){el('message').textContent='יש לבחור שם ולסמן אישור';return}if(!db){el('message').textContent='המערכת עדיין בהקמה. השמירה בענן טרם חוברה.';return}try{await setDoc(doc(db,'dalon-confirmations',n),{name:n,confirmed:true,at:serverTimestamp()});el('message').textContent='האישור נשמר בהצלחה';el('send').disabled=true}catch(e){el('message').textContent='לא ניתן לשמור כעת. נסה שוב.'}};
el('refresh').onclick=load;
function setupLock(){
 const grid=el('pattern'),svg=el('lines'),key='dalon-pattern-v1';let current=[],drawing=false,first=null;
 for(let i=0;i<9;i++){let d=document.createElement('div');d.className='dot';d.dataset.index=i;grid.append(d)}
 const dots=[...grid.querySelectorAll('.dot')];
 const position=i=>({x:40+(i%3)*80,y:40+Math.floor(i/3)*80});
 const clear=()=>{current=[];dots.forEach(d=>d.classList.remove('active'));svg.replaceChildren()};
 const add=i=>{if(i<0||current.includes(i))return;let prev=current.at(-1);current.push(i);dots[i].classList.add('active');if(prev!==undefined){let a=position(prev),b=position(i),line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);svg.append(line)}};
 const coords=(x,y)=>{let r=grid.getBoundingClientRect();return {x:(x-r.left)*240/r.width,y:(y-r.top)*240/r.height}};
 const at=(x,y)=>{let p=coords(x,y),best=-1,dist=39;for(let i=0;i<9;i++){let q=position(i),d=Math.hypot(p.x-q.x,p.y-q.y);if(d<dist){dist=d;best=i}}return best};
 let last=null;
 const trace=(x,y)=>{let p=coords(x,y);if(last){let distance=Math.hypot(p.x-last.x,p.y-last.y),steps=Math.max(1,Math.ceil(distance/8));for(let k=1;k<=steps;k++){let q={x:last.x+(p.x-last.x)*k/steps,y:last.y+(p.y-last.y)*k/steps};let i=at(grid.getBoundingClientRect().left+q.x*grid.getBoundingClientRect().width/240,grid.getBoundingClientRect().top+q.y*grid.getBoundingClientRect().height/240);add(i)}}else add(at(x,y));last=p};
 const updateHint=()=>{let saved=localStorage.getItem(key);el('locktitle').textContent=saved?'כניסת מנהל':'הגדרת תבנית מנהל';el('lockhint').textContent=saved?'צייר את התבנית שלך':first?'צייר שוב את אותה תבנית לאישור':'צייר תבנית של לפחות 4 נקודות'};
 const digest=async v=>{let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};
 grid.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;clear();last=null;grid.setPointerCapture(e.pointerId);trace(e.clientX,e.clientY)});
 grid.addEventListener('pointermove',e=>{if(drawing){e.preventDefault();trace(e.clientX,e.clientY)}});
 grid.addEventListener('pointerup',async e=>{e.preventDefault();if(!drawing)return;drawing=false;trace(e.clientX,e.clientY);last=null;let value=current.join('-');if(current.length<4){el('lockmsg').textContent='יש לחבר לפחות 4 נקודות';setTimeout(clear,500);return}let hash=await digest(value),saved=localStorage.getItem(key);if(!saved){if(!first){first=hash;el('lockmsg').textContent='צייר שוב לאישור'}else if(first===hash){localStorage.setItem(key,hash);el('lockmsg').textContent='התבנית נשמרה במכשיר זה';first=null;openManager()}else{first=null;el('lockmsg').textContent='התבניות אינן זהות, נסה שוב'}}else if(saved===hash){openManager()}else{el('lockmsg').textContent='תבנית שגויה, נסה שוב'}setTimeout(()=>{clear();updateHint()},550)});
 grid.addEventListener('pointercancel',()=>{drawing=false;clear()});grid.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});grid.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});grid.addEventListener('contextmenu',e=>e.preventDefault());updateHint();
}
function openManager(){el('lock').classList.add('hidden');el('manager').classList.remove('hidden');load()}
async function load(){el('rows').textContent='';if(!db){el('summary').textContent='טרם הוגדר חיבור מאובטח למסד הנתונים.';return}try{let snap=await getDocs(collection(db,'dalon-confirmations'));let data=new Map(snap.docs.map(d=>[d.id,d.data()]));el('summary').textContent='אישרו '+names.filter(n=>data.has(n)).length+' מתוך '+names.length;names.forEach(n=>{let d=data.get(n),r=document.createElement('div');r.className='row';let s=document.createElement('span');s.textContent=n;let t=document.createElement('span');t.className=d?'yes':'no';t.textContent=d?'✓ בוצע'+(d.at?.toDate?' - '+d.at.toDate().toLocaleString('he-IL'):''):'✗ טרם בוצע';r.append(s,t);el('rows').append(r)})}catch(e){el('summary').textContent='לא ניתן לקרוא אישורים. בדוק הרשאות.'}}
</script></body></html>
