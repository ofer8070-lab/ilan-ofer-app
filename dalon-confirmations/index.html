<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>אישור עובדים - דור אלון</title><style>body{font-family:Arial,sans-serif;background:#f0f7f2;margin:0;padding:20px;color:#19362b}main{max-width:480px;margin:auto;background:white;border-radius:18px;padding:24px;box-shadow:0 4px 20px #0001}h1{text-align:center;font-size:25px}p{line-height:1.6}select,button{font:inherit;width:100%;padding:14px;border-radius:10px;margin:12px 0}select{border:1px solid #aaa}button{border:0;background:#167d48;color:white;font-weight:bold}button:disabled{background:#aaa}label{display:flex;gap:10px;align-items:center}input{width:22px;height:22px}small{color:#666}.hidden{display:none}.row{padding:12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.yes{color:green}.no{color:#b33}a{color:#167d48}</style></head><body><main><h1>אישור הורדת אפליקציית דור אלון</h1><section id="worker"><p>כל העובדים מחויבים להוריד את אפליקציית "דור אלון" לטלפון הנייד ולאשר את ביצוע ההורדה.</p><label for="name">שם העובד</label><select id="name"><option value="">בחר שם</option></select><label><input id="check" type="checkbox">אני מאשר/ת שהורדתי את האפליקציה</label><button id="send">בוצע - שליחת אישור</button><p id="message" role="status"></p></section><section id="manager" class="hidden"><h2>מסך מנהל</h2><p id="summary"></p><div id="rows"></div><button id="refresh">רענון</button></section><p><small><a href="?manager=1">כניסה למסך מנהל</a></small></p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
import {getFirestore,doc,setDoc,getDocs,collection,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';
const names=['סופיאן','נביל','עסב','קווינד','זיאד','שאהר','ענתר','מודי'];
const config=null; // REQUIRED: configure Firebase project before use
const db=config?getFirestore(initializeApp(config)):null;
const el=id=>document.getElementById(id);
names.forEach(n=>{let o=document.createElement('option');o.value=n;o.textContent=n;el('name').append(o)});
if(location.search.includes('manager=1')){el('worker').classList.add('hidden');el('manager').classList.remove('hidden');load();}
el('send').onclick=async()=>{const n=el('name').value;if(!n||!el('check').checked){el('message').textContent='יש לבחור שם ולסמן אישור';return}if(!db){el('message').textContent='המערכת עדיין בהקמה. השמירה בענן טרם חוברה.';return}try{await setDoc(doc(db,'dalon-confirmations',n),{name:n,confirmed:true,at:serverTimestamp()});el('message').textContent='האישור נשמר בהצלחה';el('send').disabled=true}catch(e){el('message').textContent='לא ניתן לשמור כעת. נסה שוב.'}};
el('refresh').onclick=load;
async function load(){el('rows').textContent='';if(!db){el('summary').textContent='טרם הוגדר חיבור מאובטח למסד הנתונים.';return}try{let snap=await getDocs(collection(db,'dalon-confirmations'));let data=new Map(snap.docs.map(d=>[d.id,d.data()]));el('summary').textContent='אישרו '+names.filter(n=>data.has(n)).length+' מתוך '+names.length;names.forEach(n=>{let d=data.get(n),r=document.createElement('div');r.className='row';let s=document.createElement('span');s.textContent=n;let t=document.createElement('span');t.className=d?'yes':'no';t.textContent=d?'✓ בוצע'+(d.at?.toDate?' - '+d.at.toDate().toLocaleString('he-IL'):''):'✗ טרם בוצע';r.append(s,t);el('rows').append(r)})}catch(e){el('summary').textContent='לא ניתן לקרוא אישורים. בדוק הרשאות.'}}
</script></body></html>
