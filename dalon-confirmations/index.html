<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>אישור עובדים - דור אלון</title><style>body{font-family:Arial,sans-serif;background:#f0f7f2;margin:0;padding:20px;color:#19362b}main{max-width:480px;margin:auto;background:white;border-radius:18px;padding:24px;box-shadow:0 4px 20px #0001}h1{text-align:center;font-size:25px}p{line-height:1.6}select,button{font:inherit;width:100%;padding:14px;border-radius:10px;margin:12px 0}select{border:1px solid #aaa}button{border:0;background:#167d48;color:white;font-weight:bold}button:disabled{background:#aaa}label{display:flex;gap:10px;align-items:center}input{width:22px;height:22px}small{color:#666}.hidden{display:none}.row{padding:12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.yes{color:green}.no{color:#b33}.pattern{direction:ltr;position:relative;touch-action:none;overscroll-behavior:contain;-webkit-user-select:none;-webkit-touch-callout:none;width:240px;height:240px;margin:20px auto;display:grid;grid-template-columns:repeat(3,1fr);place-items:center;user-select:none}.dot{width:23px;height:23px;background:#9aaca4;border-radius:50%;z-index:1}.dot.active{background:#167d48;box-shadow:0 0 0 8px #167d4833}.pattern svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.pattern line{stroke:#167d48;stroke-width:5;stroke-linecap:round}.notice{font-size:12px;color:#76633b}a{color:#167d48}</style></head><body><main><h1>אישור הורדת אפליקציית דור אלון</h1><section id="worker"><p>כל העובדים מחויבים להוריד את אפליקציית "דור אלון" לטלפון הנייד ולאשר את ביצוע ההורדה.</p><label for="name">שם העובד</label><select id="name"><option value="">בחר שם</option></select><label><input id="check" type="checkbox">אני מאשר/ת שהורדתי את האפליקציה</label><button id="send">בוצע - שליחת אישור</button><p id="message" role="status"></p></section><section id="lock" class="hidden"><h2>כניסת מנהל</h2><label for="pin">קוד מנהל (4 ספרות)</label><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••" style="box-sizing:border-box;width:100%;font-size:26px;text-align:center;padding:12px;border:1px solid #aaa;border-radius:10px"><button id="unlock">כניסה</button><p id="lockmsg" role="status"></p><p class="notice">קוד זה הוא נעילה בסיסית של המסך בלבד. להגנה על נתונים בענן נדרש אימות בצד השרת.</p></section><section id="manager" class="hidden"><button id="googleLogin">התחבר עם Google</button><p id="authstatus" role="status">יש להתחבר לחשבון Google כדי לצפות בדוחות</p><h2>מסך מנהל</h2><p id="summary"></p><div id="rows"></div><button id="refresh">רענון</button></section><p><small><a href="?manager=1">כניסה למסך מנהל</a></small></p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';
import {getFirestore,doc,setDoc,getDocs,collection,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';
const names=['סופיאן','נביל','עסב','קווינד','זיאד','שאהר','ענתר','מודי'];
const config={"apiKey":"AIzaSyBptu4EVeypaCiGRDA4PRf8lh7AaQXbR4c","authDomain":"dalton-employees.firebaseapp.com","projectId":"dalton-employees","storageBucket":"dalton-employees.firebasestorage.app","messagingSenderId":"66433309569","appId":"1:66433309569:web:0ae8654c6a8376b080a680","measurementId":"G-J44CSVN3VJ"};
const app=config?initializeApp(config):null;
const db=app?getFirestore(app):null;
const auth=app?getAuth(app):null;
const MANAGER_UID='kv3VMdgMRFYScVLiET9oX0bwVhB2';
let signedInManager=false;
if(auth)onAuthStateChanged(auth,user=>{signedInManager=!!user&&user.uid===MANAGER_UID;el('authstatus').textContent=signedInManager?'מחובר: '+(user.email||'Google'):'יש להתחבר עם Google';if(signedInManager)load()});
const el=id=>document.getElementById(id);
names.forEach(n=>{let o=document.createElement('option');o.value=n;o.textContent=n;el('name').append(o)});
if(new URLSearchParams(location.search).has('manager')){el('worker').classList.add('hidden');el('lock').classList.remove('hidden');setupPin();}
el('send').onclick=async()=>{const n=el('name').value;if(!n||!el('check').checked){el('message').textContent='יש לבחור שם ולסמן אישור';return}if(!db){el('message').textContent='המערכת עדיין בהקמה. השמירה בענן טרם חוברה.';return}try{if(!auth.currentUser)await signInAnonymously(auth);await setDoc(doc(db,'dalon-confirmations',n),{name:n,confirmed:true,at:serverTimestamp()});el('message').textContent='האישור נשמר בהצלחה';el('send').disabled=true}catch(e){el('message').textContent='לא ניתן לשמור כעת. נסה שוב.'}};
el('refresh').onclick=load;
el('googleLogin').onclick=async()=>{if(!auth){el('authstatus').textContent='חיבור Firebase עדיין לא הושלם';return}try{const result=await signInWithPopup(auth,new GoogleAuthProvider());el('authstatus').textContent=result.user.uid===MANAGER_UID?'התחברת כמנהל: '+result.user.email:'חשבון Google זה אינו מורשה כמנהל';signedInManager=result.user.uid===MANAGER_UID;if(signedInManager)load()}catch(e){el('authstatus').textContent='ההתחברות נכשלה: '+e.code}};
function setupPin(){const pin=el('pin'),msg=el('lockmsg');const verify=()=>{if(pin.value==='1566'){pin.value='';openManager()}else{msg.textContent='קוד שגוי';pin.value='';pin.focus()}};el('unlock').onclick=verify;pin.addEventListener('keydown',e=>{if(e.key==='Enter')verify()});pin.addEventListener('input',()=>{pin.value=pin.value.replace(/\\D/g,'').slice(0,4);msg.textContent=''})}
function openManager(){el('lock').classList.add('hidden');el('manager').classList.remove('hidden');load()}
async function load(){el('rows').textContent='';if(!signedInManager){el('summary').textContent='התחבר עם Google כדי לצפות בדוחות';return}if(!db){el('summary').textContent='המערכת עדיין לא מחוברת לשמירה בענן. לא ניתן לקבל אישורים אמיתיים עד לחיבור.';names.forEach(n=>{let r=document.createElement('div');r.className='row';let a=document.createElement('span');a.textContent=n;let b=document.createElement('span');b.textContent='ממתין לחיבור';b.className='no';r.append(a,b);el('rows').append(r)});return}try{let snap=await getDocs(collection(db,'dalon-confirmations'));let data=new Map(snap.docs.map(d=>[d.id,d.data()]));el('summary').textContent='אישרו '+names.filter(n=>data.has(n)).length+' מתוך '+names.length;names.forEach(n=>{let d=data.get(n),r=document.createElement('div');r.className='row';let s=document.createElement('span');s.textContent=n;let t=document.createElement('span');t.className=d?'yes':'no';t.textContent=d?'✓ בוצע'+(d.at?.toDate?' - '+d.at.toDate().toLocaleString('he-IL'):''):'✗ טרם בוצע';r.append(s,t);el('rows').append(r)})}catch(e){el('summary').textContent='לא ניתן לקרוא אישורים. בדוק הרשאות.'}}
</script></body></html>
