<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b43"><title>שינוי מחירים</title><style>
:root{font-family:Arial,system-ui,sans-serif;color:#163540;background:#f1f6f6}*{box-sizing:border-box}body{margin:0;padding:20px 12px 60px}.wrap{max-width:750px;margin:auto}header{background:#123b43;color:white;padding:24px 20px;border-radius:22px;margin-bottom:18px}h1{margin:0 0 6px;font-size:29px}header p{margin:0;color:#cae2e1}section{background:white;margin:16px 0;border-radius:20px;padding:18px;box-shadow:0 5px 18px #17475012}h2{font-size:21px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:bold}.field input{width:100%;border:2px solid #d5e4e5;background:#edfaf2;border-radius:12px;padding:12px 8px;font-size:21px;text-align:center;color:#113b38;outline:none}.field input:focus{border-color:#1b9680}label small{font-size:11px;font-weight:normal;color:#567} .result{background:#f0f6f9;border-radius:14px;padding:12px;text-align:center;min-width:0}.result.green{background:#e9f8ed}.result.yellow{background:#fff6be}.result.pink{background:#fff0e9}.result .caption{font-size:13px;color:#45606b;margin-bottom:6px}.result strong{display:block;font-size:25px;direction:ltr}.subheading{font-size:15px;font-weight:bold;margin:20px 0 9px;color:#2f5361}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:9px} .difference{border-top:1px solid #dae6e6;padding-top:12px;margin-top:14px}.difference .result{background:#f7f9fa}.difference .result strong{font-size:21px}footer{text-align:center;font-size:12px;color:#667;margin-top:20px}.note{margin:12px 1px 2px;font-size:12px;color:#567}button{background:#123b43;color:white;border:0;border-radius:12px;padding:12px 16px;font-weight:bold;font-size:15px;cursor:pointer}.controls{display:flex;align-items:center;justify-content:space-between;margin:15px 0 0;gap:8px}.tag{background:#d8f1e6;color:#17664e;border-radius:25px;padding:8px 10px;font-size:12px}.top-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:410px){body{padding:10px 9px 35px}section{padding:14px}.result strong{font-size:22px}.result{padding:10px 5px}.top-grid{grid-template-columns:1fr}header{padding:20px}h1{font-size:26px}} 
</style></head><body><div class="wrap"><header><h1>⛽ שינוי מחירים</h1><p>מחשבון מחירי סולר לסניפים</p></header>
<section><h2>מחיר סולר מחירון</h2><div class="grid"><label class="field">מחירון ישן <small>₪ לליטר</small><input inputmode="decimal" id="oldPrice" placeholder="לדוגמה 20.50"></label><label class="field">מחירון חדש <small>₪ לליטר</small><input inputmode="decimal" id="newPrice" placeholder="לדוגמה 20.50"></label></div><div class="controls"><span class="tag" id="saved">השינויים נשמרים במכשיר</span><button id="reset">איפוס נתונים</button></div></section>
<div id="branches"></div>
<footer>כל המחירים בש״ח לליטר. נוסחה: מחיר סולר = מחירון פחות הנחה. ההפרש = מחיר ישן פחות מחיר חדש.</footer></div>
<script>
const branchNames=['קרית ענבים','מנדלבאום'];
const channels=[{name:'אשראי',type:'credit'},{name:'מזומן',type:'cash'}];
const defaults={oldPrice:'20.5',newPrice:'20.5', '0-credit-old':'9.58','0-credit-new':'9.65','0-cash-old':'10.72','0-cash-new':'10.75','1-credit-old':'9.88','1-credit-new':'9.75','1-cash-old':'9.88','1-cash-new':'9.75','0-self-old':'7.81','0-self-new':'7.81','0-full-old':'8.11','0-full-new':'8.11','1-self-old':'7.85','1-self-new':'7.85','1-full-old':'8.11','1-full-new':'8.11'};
let values={...defaults};try{values={...defaults,...JSON.parse(localStorage.getItem('fuel-price-calculator-v1')||'{}')}}catch(e){}
const num=v=>{const n=Number(String(v??'').replace(',','.'));return String(v??'').trim()!==''&&Number.isFinite(n)?n:null};
const fmt=n=>n===null?'—':(Math.abs(n)<0.005?0:n).toFixed(2);
const id=(b,ch,time)=>b+'-'+ch+'-'+time;
function branchCard(b){let name=branchNames[b];return `<section><h2>📍 ${name}</h2><div class="subheading">הנחות אשראי ומזומן - מזינים רק הנחה</div><div class="grid">${channels.map(c=>`<label class="field">${c.name} - הנחה ישנה<input inputmode="decimal" data-key="${id(b,c.type,'old')}" placeholder="הנחה"></label><label class="field">${c.name} - הנחה חדשה<input inputmode="decimal" data-key="${id(b,c.type,'new')}" placeholder="הנחה"></label>`).join('')}</div><div class="subheading">מחירי סולר מחושבים</div><div class="grid">${channels.map(c=>`<div class="result green"><div class="caption">${c.name} - מחיר ישן</div><strong id="${id(b,c.type,'old')}-price">—</strong></div><div class="result green"><div class="caption">${c.name} - מחיר חדש</div><strong id="${id(b,c.type,'new')}-price">—</strong></div>`).join('')}</div><div class="grid difference">${channels.map(c=>`<div class="result"><div class="caption">${c.name} - הפרש</div><strong id="${id(b,c.type,'diff')}">—</strong></div>`).join('')}</div><div class="subheading">מחירי בנזין וההנחה</div><div class="grid"><label class="field">הנחת בנזין ישנה<input inputmode="decimal" data-key="${b}-gas-discount-old" placeholder="לא הוגדר"></label><label class="field">הנחת בנזין חדשה<input inputmode="decimal" data-key="${b}-gas-discount-new" placeholder="לא הוגדר"></label></div><div class="note">להשלמת חישוב בנזין ניתן להזין בנפרד את מחיר הבנזין לפני הנחה:</div><div class="grid"><label class="field">מחיר בנזין בסיסי ישן<input inputmode="decimal" data-key="${b}-gas-base-old" placeholder="מחיר בסיס"></label><label class="field">מחיר בנזין בסיסי חדש<input inputmode="decimal" data-key="${b}-gas-base-new" placeholder="מחיר בסיס"></label></div><div class="grid" style="margin-top:12px"><div class="result yellow"><div class="caption">בנזין עצמי - ישן</div><strong id="${b}-self-old-out">—</strong></div><div class="result yellow"><div class="caption">בנזין עצמי - חדש</div><strong id="${b}-self-new-out">—</strong></div><div class="result pink"><div class="caption">בנזין מלא - ישן</div><strong id="${b}-full-old-out">—</strong></div><div class="result pink"><div class="caption">בנזין מלא - חדש</div><strong id="${b}-full-new-out">—</strong></div></div><div class="note">מחירי הבנזין מוצגים רק כאשר הוזנו מחירי בסיס והנחות בנזין. אין שימוש במחירון הסולר לחישוב בנזין.</div></section>`}
document.getElementById('branches').innerHTML=branchNames.map((_,i)=>branchCard(i)).join('');
document.querySelectorAll('input').forEach(el=>{const key=el.dataset.key||el.id;el.value=values[key]??'';el.addEventListener('input',()=>{values[key]=el.value;localStorage.setItem('fuel-price-calculator-v1',JSON.stringify(values));calculate()})});
function calculate(){for(let b=0;b<branchNames.length;b++){for(let c of channels){for(let t of ['old','new']){const p=num(values[t+'Price']),d=num(values[id(b,c.type,t)]);document.getElementById(id(b,c.type,t)+'-price').textContent=fmt(p===null||d===null?null:p-d)}const o=num(values.oldPrice),n=num(values.newPrice),od=num(values[id(b,c.type,'old')]),nd=num(values[id(b,c.type,'new')]);document.getElementById(id(b,c.type,'diff')).textContent=fmt([o,n,od,nd].some(x=>x===null)?null:(o-od)-(n-nd))}
for(let t of ['old','new']){const base=num(values[b+'-gas-base-'+t]),discount=num(values[b+'-gas-discount-'+t]);document.getElementById(b+'-self-'+t+'-out').textContent=fmt(base===null||discount===null?null:base-discount);document.getElementById(b+'-full-'+t+'-out').textContent=fmt(base)}
}}
document.getElementById('reset').onclick=()=>{if(confirm('לאפס את כל הנתונים שהוזנו?')){values={};localStorage.removeItem('fuel-price-calculator-v1');document.querySelectorAll('input').forEach(e=>e.value='');calculate()}};
calculate();
</script></body></html>
