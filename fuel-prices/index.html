<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b43"><title>שינוי מחירים</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#172b3b;font-family:Arial,system-ui,sans-serif;padding:0 12px 40px}.app{max-width:650px;margin:auto}.hero{background:#123b43;color:white;margin:0 -12px;padding:22px 18px 16px}h1{font-size:26px;margin:0 0 16px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tab{padding:14px 4px;border:1px solid #8ba6a9;border-radius:13px;background:#2a535b;color:white;font-size:18px;font-weight:bold;cursor:pointer}.tab.active{background:#fff;color:#123b43;border-color:white}.page{display:none}.page.active{display:block}.card{background:white;border-radius:18px;margin-top:16px;padding:17px;box-shadow:0 3px 12px #16354012}h2{font-size:19px;margin:0 0 15px}.field{display:block;font-size:14px;font-weight:bold;color:#286347}.field input{margin-top:8px;width:100%;border:2px solid #a4d7b3;background:#e1f8e8;color:#087b31;border-radius:12px;padding:13px;font-size:23px;font-weight:bold;text-align:center;outline:none;direction:ltr}.field input:focus{border-color:#12894a}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.results{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.result{border-radius:13px;background:#ffe8e8;padding:16px 8px;text-align:center}.result span{display:block;color:#7c3d3d;font-size:14px;margin-bottom:9px}.result strong{color:#bc202b;font-size:29px;direction:ltr;display:block}.hint{font-size:13px;color:#617381;line-height:1.5;margin:12px 0 0}.foot{font-size:12px;text-align:center;color:#75848e;margin:20px 0}button.reset{border:1px solid #d2dbdf;background:#fff;color:#526b77;border-radius:12px;padding:11px 16px;font-size:14px;cursor:pointer;margin-top:16px}@media(max-width:360px){.result strong{font-size:24px}.card{padding:13px}.fields,.results{gap:8px}}
</style></head><body><div class="app"><header class="hero"><h1>⛽ שינוי מחירים</h1><nav class="tabs" aria-label="בחירת סניף"><button class="tab active" data-branch="0">ענבים</button><button class="tab" data-branch="1">מנדלבאום</button></nav></header><main id="pages"></main><div class="foot">הנתונים נשמרים אוטומטית במכשיר</div></div><script>
const names=['ענבים','מנדלבאום'];const oldKey='fuel-price-calculator-v1',key='fuel-price-calculator-v2';let previous={};try{previous=JSON.parse(localStorage.getItem(oldKey)||'{}')}catch(e){}let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}const defaults={newPrice:previous.newPrice??'20.5','0-credit-new':previous['0-credit-new']??'9.65','0-cash-new':previous['0-cash-new']??'10.75','1-credit-new':previous['1-credit-new']??'9.75','1-cash-new':previous['1-cash-new']??'9.75'};let values={...defaults,...saved};const number=x=>{if(x===undefined||x===null||String(x).trim()==='')return null;let n=Number(String(x).replace(',','.'));return Number.isFinite(n)?n:null};const format=n=>n===null?'—':n.toFixed(2);
document.getElementById('pages').innerHTML=names.map((name,i)=>`<div class="page ${i===0?'active':''}" id="page-${i}"><section class="card"><h2>מחירון סולר חדש</h2><label class="field">מחיר מחירון (₪ לליטר)<input inputmode="decimal" data-key="${i}-price" placeholder="הזן מחירון"></label></section><section class="card"><h2>הנחות סולר - ${name}</h2><div class="fields"><label class="field">הנחת אשראי<input inputmode="decimal" data-key="${i}-credit" placeholder="0.00"></label><label class="field">הנחת מזומן<input inputmode="decimal" data-key="${i}-cash" placeholder="0.00"></label></div><div class="results"><div class="result"><span>מחיר אשראי חדש</span><strong id="credit-${i}">—</strong></div><div class="result"><span>מחיר מזומן חדש</span><strong id="cash-${i}">—</strong></div></div><p class="hint">המחיר מחושב אוטומטית: מחירון פחות הנחה.</p></section><section class="card"><h2>בנזין - ${name}</h2><div class="fields"><label class="field">מחיר בסיס חדש<input inputmode="decimal" data-key="${i}-gas-base" placeholder="מחיר בסיס"></label><label class="field">הנחת בנזין<input inputmode="decimal" data-key="${i}-gas-discount" placeholder="הנחה"></label></div><div class="results"><div class="result"><span>בנזין עצמי חדש</span><strong id="self-${i}">—</strong></div><div class="result"><span>בנזין מלא חדש</span><strong id="full-${i}">—</strong></div></div><p class="hint">מחיר עצמי = מחיר בסיס פחות הנחה. מחיר מלא = מחיר בסיס.</p></section><button class="reset" data-reset="${i}">איפוס סניף</button></div>`).join('');
for(let i=0;i<2;i++){const prefix=i+'-';values[prefix+'price']??=values.newPrice;values[prefix+'credit']??=values[prefix+'credit-new'];values[prefix+'cash']??=values[prefix+'cash-new'];values[prefix+'gas-base']??=previous[prefix+'gas-base-new']??'';values[prefix+'gas-discount']??=previous[prefix+'gas-discount-new']??''}
function update(){for(let i=0;i<2;i++){let p=number(values[i+'-price']);for(let c of ['credit','cash']){let d=number(values[i+'-'+c]);document.getElementById(c+'-'+i).textContent=format(p===null||d===null?null:p-d)}let base=number(values[i+'-gas-base']),discount=number(values[i+'-gas-discount']);document.getElementById('self-'+i).textContent=format(base===null||discount===null?null:base-discount);document.getElementById('full-'+i).textContent=format(base)}}document.querySelectorAll('input').forEach(el=>{el.value=values[el.dataset.key]??'';el.addEventListener('input',()=>{values[el.dataset.key]=el.value;localStorage.setItem(key,JSON.stringify(values));update()})});document.querySelectorAll('.tab').forEach(el=>el.addEventListener('click',()=>{let i=el.dataset.branch;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b===el));document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+i))}));document.querySelectorAll('[data-reset]').forEach(el=>el.addEventListener('click',()=>{let i=el.dataset.reset;if(!confirm('לאפס נתוני סניף '+names[i]+'?'))return;for(let k of Object.keys(values))if(k.startsWith(i+'-'))values[k]='';document.querySelectorAll('#page-'+i+' input').forEach(input=>input.value='');localStorage.setItem(key,JSON.stringify(values));update()}));update();
</script></body></html>
