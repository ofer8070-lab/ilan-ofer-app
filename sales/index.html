<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153e35"><title>מכירות</title><style>*{box-sizing:border-box}body{margin:0;background:#edf5f1;color:#173b32;font:16px Arial,sans-serif}main{max-width:720px;margin:auto;padding:14px}header{background:#174d3d;color:white;padding:20px;border-radius:17px;margin-bottom:14px}h1{margin:0 0 8px}h2{font-size:20px}nav,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{border:0;border-radius:10px;padding:12px 15px;font:inherit;font-weight:bold;cursor:pointer;background:#d8e8df;color:#173b32}button.active,button.primary{background:#16684c;color:white}.panel{background:white;padding:18px;border-radius:16px;margin-bottom:13px;box-shadow:0 2px 8px #0001}label{display:block;font-weight:bold;margin:12px 0 6px}input,select{width:100%;padding:12px;border:1px solid #b9d0c4;border-radius:10px;font:inherit;background:#effaf1}input[type=file]{background:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.note{font-size:13px;color:#5d756c;line-height:1.5}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{border-bottom:1px solid #ddd;padding:10px;text-align:right}th{background:#e6f2eb}.danger{background:#fce2e2;color:#a11}.total{font-size:21px;font-weight:bold;padding:10px;background:#eaf5ee;border-radius:10px;margin:10px 0}#notice{position:fixed;bottom:15px;right:15px;left:15px;background:#174d3d;color:white;padding:15px;border-radius:12px;text-align:center;display:none;z-index:10}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><main><header><h1>📊 מכירות</h1><div>ענבים | מנדלבאום</div></header><nav><button data-page="entry" class="active">➕ דיווח חדש</button><button data-page="reports">📊 סיכומים</button><button data-page="backup">💾 גיבוי ושחזור</button></nav><section id="entry" class="panel"><h2>דיווח חדש</h2><label>תחנה</label><select id="station"><option>ענבים</option><option>מנדלבאום</option></select><label>סוג דוח</label><select id="kind"><option value="safe">קמפיוסייף</option><option value="tank">מיכליות</option></select><form id="form"><label>תאריך</label><input id="date" type="date" required><div id="safeFields"><label>סכום ₪</label><input id="amount" type="number" min="0" step="0.01" inputmode="decimal"></div><div id="tankFields" class="hidden"><label>סוג</label><select id="fuel"><option>סולר</option><option>95</option><option>אוריאה</option></select><label>מספר תעודה</label><input id="certificate" type="text"><label>כמות (ליטרים)</label><input id="quantity" type="number" min="0" step="0.01" inputmode="decimal"></div><div class="actions" style="margin-top:18px"><button class="primary" type="submit" id="save">שמור דיווח</button><button type="button" id="cancel" class="hidden">ביטול עריכה</button></div></form></section><section id="reports" class="panel hidden"><h2>📊 דוחות וסיכומים</h2><div class="grid"><div><label>תחנה</label><select id="filterStation"><option value="all">כל התחנות</option><option>ענבים</option><option>מנדלבאום</option></select></div><div><label>דוח</label><select id="filterKind"><option value="all">כל הדוחות</option><option value="safe">קמפיוסייף</option><option value="tank">מיכליות</option></select></div><div><label>מתאריך</label><input id="from" type="date"></div><div><label>עד תאריך</label><input id="to" type="date"></div></div><div id="totals" class="total"></div><div class="actions"><button id="excel" class="primary">📥 הורד דוח לאקסל</button><button id="share">✉️ שלח דוח במייל</button></div><div class="scroll"><table><thead><tr><th>תאריך</th><th>תחנה</th><th>דוח</th><th>סוג</th><th>מספר תעודה</th><th>סכום ₪</th><th>כמות ליטרים</th><th>פעולות</th></tr></thead><tbody id="rows"></tbody></table></div></section><section id="backup" class="panel hidden"><h2>גיבוי ושחזור</h2><p class="note">המידע נשמר במכשיר ובדפדפן הנוכחי. מומלץ לבצע גיבוי ל-iCloud Drive. GitHub מאחסן את קוד האפליקציה, לא את הדיווחים שלך.</p><button id="backupBtn" class="primary">📤 צור קובץ גיבוי</button><label>בחר קובץ גיבוי לשחזור</label><input id="restoreFile" type="file" accept=".json,application/json"><button id="restoreBtn" style="margin-top:12px">📥 שחזר נתונים</button><p class="note">השחזור מחליף את כל הדיווחים במכשיר זה לאחר אישור.</p></section></main><div id="notice" role="status"></div><script>
(()=>{'use strict';const KEY='sales-stations-v1',el=id=>document.getElementById(id),today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};let items=[],editing=null;try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(data))items=data}catch(e){}el('date').value=today();function notify(s){el('notice').textContent=s;el('notice').style.display='block';setTimeout(()=>el('notice').style.display='none',2400)}function save(){try{localStorage.setItem(KEY,JSON.stringify(items));return true}catch(e){alert('השמירה נכשלה. יש לבצע גיבוי ולבדוק מקום אחסון.');return false}}function page(p){['entry','reports','backup'].forEach(x=>el(x).classList.toggle('hidden',x!==p));document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(p==='reports')render()}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>page(b.dataset.page));function kind(){el('safeFields').classList.toggle('hidden',el('kind').value!=='safe');el('tankFields').classList.toggle('hidden',el('kind').value!=='tank')}el('kind').onchange=kind;function reset(){editing=null;el('form').reset();el('date').value=today();el('save').textContent='שמור דיווח';el('cancel').classList.add('hidden');kind()}el('cancel').onclick=reset;el('form').onsubmit=e=>{e.preventDefault();const k=el('kind').value,a=el('amount').value,q=el('quantity').value,c=el('certificate').value.trim();if(!el('date').value||(k==='safe'&&(a===''||!Number.isFinite(+a)||+a<0))||(k==='tank'&&(!c||q===''||!Number.isFinite(+q)||+q<0))){alert('יש למלא את כל השדות הנדרשים');return}const obj={id:editing||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now())+Math.random()),station:el('station').value,kind:k,date:el('date').value,amount:k==='safe'?+a:null,fuel:k==='tank'?el('fuel').value:'',certificate:k==='tank'?c:'',quantity:k==='tank'?+q:null};const old=items.slice();if(editing)items=items.map(x=>x.id===editing?obj:x);else items.push(obj);if(!save()){items=old;return}reset();notify('הדיווח נשמר בהצלחה')};function filtered(){return items.filter(x=>(el('filterStation').value==='all'||x.station===el('filterStation').value)&&(el('filterKind').value==='all'||x.kind===el('filterKind').value)&&(!el('from').value||x.date>=el('from').value)&&(!el('to').value||x.date<=el('to').value)).sort((a,b)=>b.date.localeCompare(a.date))}function cell(tr,s){const td=document.createElement('td');td.textContent=s==null?'':String(s);tr.append(td)}function render(){const data=filtered(),sum=data.filter(x=>x.kind==='safe').reduce((s,x)=>s+x.amount,0),lit=data.filter(x=>x.kind==='tank').reduce((s,x)=>s+x.quantity,0);el('totals').textContent='קמפיוסייף: ₪'+sum.toLocaleString('he-IL')+' | מיכליות: '+lit.toLocaleString('he-IL')+' ליטר | '+data.length+' רשומות';el('rows').replaceChildren();for(const x of data){const tr=document.createElement('tr');[x.date,x.station,x.kind==='safe'?'קמפיוסייף':'מיכליות',x.fuel,x.certificate,x.amount,x.quantity].forEach(v=>cell(tr,v));const td=document.createElement('td'),edit=document.createElement('button'),del=document.createElement('button');edit.textContent='ערוך';edit.onclick=()=>{editing=x.id;el('station').value=x.station;el('kind').value=x.kind;kind();el('date').value=x.date;el('amount').value=x.amount??'';el('fuel').value=x.fuel||'סולר';el('certificate').value=x.certificate;el('quantity').value=x.quantity??'';el('save').textContent='שמור שינויים';el('cancel').classList.remove('hidden');page('entry')};del.textContent='מחק';del.className='danger';del.onclick=()=>{if(!confirm('למחוק דיווח זה?'))return;const old=items.slice();items=items.filter(y=>y.id!==x.id);if(!save())items=old;render()};td.append(edit,' ',del);tr.append(td);el('rows').append(tr)}}['filterStation','filterKind','from','to'].forEach(id=>el(id).onchange=render);function csv(){const lines=[['תאריך','תחנה','דוח','סוג','מספר תעודה','סכום ₪','כמות ליטרים'],...filtered().map(x=>[x.date,x.station,x.kind==='safe'?'קמפיוסייף':'מיכליות',x.fuel,x.certificate,x.amount??'',x.quantity??''])];return '\ufeff'+lines.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n')}function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}function csvFile(){return new File([csv()],'sales-'+today()+'.csv',{type:'text/csv;charset=utf-8'})}el('excel').onclick=()=>download(csvFile(),'sales-'+today()+'.csv');el('share').onclick=async()=>{const f=csvFile();try{if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f],title:'דוח מכירות'});return}}catch(e){if(e.name==='AbortError')return}download(f,f.name);notify('הדוח הורד. ניתן לצרף אותו למייל')};el('backupBtn').onclick=async()=>{const f=new File([JSON.stringify({version:1,items,created:new Date().toISOString()},null,2)],'sales-backup-'+today()+'.json',{type:'application/json'});try{if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f],title:'גיבוי מכירות'});return}}catch(e){if(e.name==='AbortError')return}download(f,f.name)};el('restoreBtn').onclick=async()=>{const f=el('restoreFile').files[0];if(!f)return alert('בחר קובץ');try{const data=JSON.parse(await f.text());if(data.version!==1||!Array.isArray(data.items)||!data.items.every(x=>x&&typeof x.id==='string'&&['ענבים','מנדלבאום'].includes(x.station)&&['safe','tank'].includes(x.kind)&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&(x.kind==='safe'?typeof x.amount==='number'&&Number.isFinite(x.amount)&&x.amount>=0:typeof x.quantity==='number'&&Number.isFinite(x.quantity)&&x.quantity>=0&&typeof x.certificate==='string'&&['סולר','95','אוריאה'].includes(x.fuel))))throw Error('קובץ לא תקין');if(!confirm('להחליף את כל הדיווחים הקיימים?'))return;const old=items;items=data.items;if(!save()){items=old;return}notify('השחזור הושלם');el('restoreFile').value=''}catch(e){alert('שגיאה בשחזור: '+e.message)}};render()})();
</script></body></html>
