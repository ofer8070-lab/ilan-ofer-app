<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e473e"><title>משימות יומיות | תחנות</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#18342f;background:#eef6f1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(150deg,#e9f4ee,#f8faf8)}main{width:min(570px,100%);margin:auto;padding:22px 16px 46px}.top{background:#0f5145;border-radius:24px;padding:24px 20px;color:white;box-shadow:0 14px 30px #143f3526}.eyebrow{margin:0 0 5px;opacity:.8;font-size:14px}.top h1{font-size:27px;margin:0 0 20px}.datebar{display:grid;grid-template-columns:50px minmax(0,1fr) 50px;align-items:center;gap:8px}.arrow{height:48px;border:1px solid #ffffff44;background:#ffffff20;color:white;font-size:29px;border-radius:14px;cursor:pointer}.datewrap{text-align:center}.datewrap label{font-size:12px;color:#c7e5db;display:block}.datewrap input{font-family:inherit;cursor:pointer;color:white;background:transparent;border:0;font-size:17px;font-weight:700;text-align:center;max-width:190px;width:100%;color-scheme:dark}.today{display:block;margin:12px auto 0;border:0;background:#dbf4e7;color:#0e5145;border-radius:16px;padding:8px 16px;font-weight:700}.stations{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0 14px}.station{padding:15px;border-radius:16px;background:white;color:#39574f;font-size:18px;font-weight:750;border:2px solid #d9e8df;cursor:pointer}.station.active{background:#dcf5e8;border-color:#148052;color:#075337}.summary{background:white;border-radius:18px;padding:17px;margin-bottom:15px;box-shadow:0 5px 18px #142f2410}.summaryline{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700}.progress{height:11px;background:#edf2ee;border-radius:14px;overflow:hidden;margin-top:12px}.progress div{height:100%;width:0;background:#2b9b65;transition:width .22s}.tasks{display:grid;gap:11px}.task{display:flex;align-items:center;justify-content:space-between;padding:16px;border-radius:18px;background:#ffe8e8;border:2px solid #f3baba;color:#b32b2b;min-height:70px;cursor:pointer;transition:background .15s,border-color .15s}.task.done{background:#e0f5e7;border-color:#a2d7b0;color:#15763d}.task strong{font-size:18px}.task small{display:block;margin-top:5px;font-size:12px;color:inherit;opacity:.78}.task input{width:26px;height:26px;accent-color:#198754;flex-shrink:0;cursor:pointer;margin:0 0 0 4px}.bottom{color:#5d746a;text-align:center;font-size:12px;line-height:1.8;margin:20px 8px}.dot{font-size:14px}.titlepart{display:flex;align-items:center;gap:8px}.emoji{font-size:22px}@media(max-width:390px){.top h1{font-size:24px}.task strong{font-size:16px}} </style></head>
<body><main><section class="top"><p class="eyebrow">בקרה וניהול תחנות</p><h1>✅ המשימות היומיות שלי</h1><div class="datebar"><button id="next" class="arrow" type="button" aria-label="יום הבא">❯</button><div class="datewrap"><label for="date">בחר תאריך או דפדף בין הימים</label><input id="date" type="date"></div><button id="prev" class="arrow" type="button" aria-label="יום קודם">❮</button></div><button id="today" class="today" type="button">חזרה להיום</button></section>
<nav class="stations" aria-label="בחירת תחנה"><button type="button" class="station active" data-station="anavim">🌿 ענבים</button><button type="button" class="station" data-station="mandelbaum">🏢 מנדלבאום</button></nav>
<section class="summary"><div class="summaryline"><span id="stationTitle">תחנת ענבים</span><span id="counter">0 מתוך 7 הושלמו</span></div><div class="progress" aria-label="התקדמות"><div id="progress"></div></div></section>
<section id="tasks" class="tasks" aria-label="משימות לביצוע"></section><p class="bottom">🔴 אדום = טרם בוצע &nbsp; | &nbsp; 🟢 ירוק = בוצע<br>הסימונים נשמרים אוטומטית במכשיר זה, בנפרד לכל תחנה ותאריך.</p></main>
<script>
(()=>{'use strict';const labels=['משמרות במירקם','מדידות','שידורים','כספונט','איידו','מיילים','שעות עובדים'];const icons=['📋','📏','📡','💳','🗂️','✉️','🕒'];const el=id=>document.getElementById(id);let station='anavim';const dateInput=el('date');const dayString=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const parseDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};dateInput.value=dayString(new Date());const storageKey=()=> 'daily-station-tasks-v1:'+station+':'+dateInput.value;function load(){try{const a=JSON.parse(localStorage.getItem(storageKey())||'[]');return Array.isArray(a)?labels.map((_,i)=>a[i]===true):labels.map(()=>false)}catch{return labels.map(()=>false)}}function save(a){try{localStorage.setItem(storageKey(),JSON.stringify(a))}catch{alert('לא ניתן לשמור במכשיר. בדוק שהדפדפן מאפשר אחסון מקומי.')}}function render(){const state=load();el('stationTitle').textContent=station==='anavim'?'תחנת ענבים':'תחנת מנדלבאום';const count=state.filter(Boolean).length;el('counter').textContent=count+' מתוך '+labels.length+' הושלמו';el('progress').style.width=(count/labels.length*100)+'%';const host=el('tasks');host.replaceChildren();labels.forEach((label,i)=>{const row=document.createElement('label');row.className='task'+(state[i]?' done':'');const text=document.createElement('span');const title=document.createElement('strong');title.className='titlepart';const ic=document.createElement('span');ic.className='emoji';ic.textContent=icons[i];const name=document.createElement('span');name.textContent=label;title.append(ic,name);const status=document.createElement('small');status.textContent=state[i]?'בוצע בהצלחה':'ממתין לביצוע';text.append(title,status);const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=state[i];checkbox.setAttribute('aria-label',label);checkbox.addEventListener('change',()=>{const fresh=load();fresh[i]=checkbox.checked;save(fresh);render()});row.append(text,checkbox);host.append(row)})}document.querySelectorAll('.station').forEach(button=>button.addEventListener('click',()=>{station=button.dataset.station;document.querySelectorAll('.station').forEach(b=>{const active=b===button;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});render()}));function move(n){const d=parseDate(dateInput.value);d.setDate(d.getDate()+n);dateInput.value=dayString(d);render()}el('prev').addEventListener('click',()=>move(-1));el('next').addEventListener('click',()=>move(1));el('today').addEventListener('click',()=>{dateInput.value=dayString(new Date());render()});dateInput.addEventListener('change',render);render()})();
</script></body></html>
