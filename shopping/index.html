<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>רשימת קניות</title><style>*{box-sizing:border-box}body{font:17px system-ui;margin:12px;background:#f4f5f6;color:#18221e}main{max-width:600px;margin:auto}header{background:#163c30;color:white;text-align:center;padding:18px;border-radius:16px}strong{display:block;font-size:38px;color:#b7f7b9}form{display:grid;grid-template-columns:2fr 3fr auto;gap:6px;margin:15px 0}input,button{min-width:0;font:inherit;border:1px solid #bbb;border-radius:9px;padding:12px 8px}button{cursor:pointer;background:#176b46;color:white;border:0}article{display:flex;align-items:center;gap:7px;background:white;padding:10px 7px;border-bottom:1px solid #ddd}article span:first-child{flex:1;overflow-wrap:anywhere}article button{font-size:14px;padding:8px;background:#e8eef5;color:#174b9c}article button:last-child{background:#ffe7e7;color:#a21e24}#status{font-size:13px;color:#666}</style><main><header>ס״ה קניות<strong id="total">0.00 ₪</strong></header><form id="form"><input id="name" placeholder="שם" required><input id="price" placeholder="סכום" inputmode="decimal" required><button id="add">הכנס</button></form><h3>רשימת תנועות</h3><section id="list"></section><p id="status"></p></main><script>const $=id=>document.getElementById(id);let items=[],editing=-1;try{items=JSON.parse(localStorage.getItem('shopping-v1')||'[]');if(!Array.isArray(items))items=[]}catch{}function save(){try{localStorage.setItem('shopping-v1',JSON.stringify(items));$('status').textContent='נשמר במכשיר'}catch{$('status').textContent='השמירה במכשיר נכשלה'}}function reset(){editing=-1;$('form').reset();$('add').textContent='הכנס'}function draw(){$('total').textContent=(items.reduce((s,x)=>s+x.c,0)/100).toFixed(2)+' ₪';const l=$('list');l.replaceChildren();if(!items.length)l.textContent='אין תנועות עדיין';items.forEach((x,i)=>{let r=document.createElement('article');let n=document.createElement('span');n.textContent=x.n;let p=document.createElement('span');p.textContent=(x.c/100).toFixed(2);let e=document.createElement('button');e.textContent='עריכה';e.onclick=()=>{editing=i;$('name').value=x.n;$('price').value=(x.c/100).toFixed(2);$('add').textContent='שמור';$('name').focus()};let d=document.createElement('button');d.textContent='מחיקה';d.onclick=()=>{if(confirm('למחוק את התנועה?')){items.splice(i,1);reset();save();draw()}};r.append(n,p,e,d);l.append(r)})}$('form').onsubmit=e=>{e.preventDefault();let n=$('name').value.trim(),v=$('price').value.trim().replace(',','.'),p=Number(v);if(!n||!v||!Number.isFinite(p)||p<0){alert('יש להזין שם וסכום תקין');return}let x={n,c:Math.round(p*100)};if(editing<0)items.push(x);else items[editing]=x;reset();draw();save();$('name').focus()};draw();</script></html>
