<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>רשימת קניות</title><style>*{box-sizing:border-box}body{font:17px system-ui;margin:12px;background:#f4f5f6;color:#18221e}main{max-width:600px;margin:auto}header{background:#163c30;color:white;text-align:center;padding:18px;border-radius:16px}strong{display:block;font-size:38px;color:#b7f7b9}form{display:grid;grid-template-columns:2fr 3fr auto auto;gap:6px;margin:15px 0}input,button{min-width:0;font:inherit;border:1px solid #bbb;border-radius:9px;padding:12px 8px}button{cursor:pointer;background:#176b46;color:white;border:0}article{display:flex;align-items:center;gap:7px;background:white;padding:10px 7px;border-bottom:1px solid #ddd}article span:first-child{flex:1;overflow-wrap:anywhere}article button{font-size:14px;padding:8px;background:#e8eef5;color:#174b9c}article button:last-child{background:#ffe7e7;color:#a21e24}#status{font-size:13px;color:#666}</style><main><header>ס״ה קניות<strong id="total">0 ₪</strong><div style="display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-top:8px;direction:rtl"><span>ס״ה בפלוס <b id="positive" style="color:#b7f7b9">0 ₪</b></span><span>ס״ה במינוס <b id="negative" style="color:#ffb4b4">0 ₪</b></span></div></header><form id="form"><input id="name" placeholder="שם" required><input id="price" placeholder="סכום" inputmode="decimal" required><button type="button" id="minus" aria-label="שינוי סימן">±</button><button id="add">הכנס</button></form><h3>רשימת תנועות</h3><section id="list"></section><p id="status"></p><button id="share" style="width:100%;background:#168347">שליחה לוואטסאפ</button><div style="display:flex;gap:8px;margin-top:10px"><button id="backup" style="flex:1;background:#315b83">גיבוי</button><button id="restore" style="flex:1;background:#315b83">שחזור</button><input type="file" id="restoreFile" accept=".json,application/json" hidden></div></main><script>const $=id=>document.getElementById(id);let items=[],editing=-1;try{items=JSON.parse(localStorage.getItem('shopping-v1')||'[]');if(!Array.isArray(items))items=[]}catch{}function save(){try{localStorage.setItem('shopping-v1',JSON.stringify(items));$('status').textContent='נשמר במכשיר'}catch{$('status').textContent='השמירה במכשיר נכשלה'}}function reset(){editing=-1;$('form').reset();$('add').textContent='הכנס'}function draw(){$('total').textContent=(items.reduce((s,x)=>s+x.c,0)/100).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2})+' ₪';const fmt=c=>(c/100).toLocaleString('en-US',{maximumFractionDigits:2})+' ₪';$('positive').textContent=fmt(items.reduce((s,x)=>s+Math.max(0,x.c),0));$('negative').textContent=fmt(items.reduce((s,x)=>s+Math.min(0,x.c),0));const l=$('list');l.replaceChildren();if(!items.length)l.textContent='אין תנועות עדיין';items.forEach((x,i)=>{let r=document.createElement('article');let n=document.createElement('span');n.textContent=x.n;let p=document.createElement('span');p.textContent=(x.c/100).toFixed(2);if(x.c<0)p.style.color='#b32626';let e=document.createElement('button');e.textContent='עריכה';e.onclick=()=>{editing=i;$('name').value=x.n;$('price').value=(x.c/100).toFixed(2);$('add').textContent='שמור';$('name').focus()};let d=document.createElement('button');d.textContent='מחיקה';d.onclick=()=>{if(confirm('למחוק את התנועה?')){items.splice(i,1);reset();save();draw()}};r.append(n,p,e,d);l.append(r)})}$('form').onsubmit=e=>{e.preventDefault();let n=$('name').value.trim(),v=$('price').value.trim().replace(',','.'),p=Number(v);if(!n||!v||!Number.isFinite(p)){alert('יש להזין שם וסכום תקין');return}let x={n,c:Math.round(p*100)};if(editing<0)items.push(x);else items[editing]=x;reset();draw();save();$('name').focus()};$('minus').onclick=()=>{const p=$('price');p.value=p.value.startsWith('-')?p.value.slice(1):'-'+p.value;p.focus()};$('share').onclick=()=>{if(!items.length){alert('אין תנועות לשליחה');return}const fmt=c=>(c/100).toLocaleString('en-US',{maximumFractionDigits:2});const msg=['רשימת קניות',...items.map(x=>x.n+' : '+fmt(x.c)+' ₪'),'────────','ס״ה הוצאות: '+fmt(items.reduce((s,x)=>s+Math.max(0,x.c),0))+' ₪','ס״ה הכנסות: '+fmt(items.reduce((s,x)=>s+Math.min(0,x.c),0))+' ₪','────────','ס״ה כללי: '+fmt(items.reduce((s,x)=>s+x.c,0))+' ₪'].join('\n');location.href='https://wa.me/?text='+encodeURIComponent(msg)};$('backup').onclick=()=>{const blob=new Blob([JSON.stringify({app:'shopping-list',version:1,items},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='shopping-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)};$('restore').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.app!=='shopping-list'||data.version!==1||!Array.isArray(data.items)||!data.items.every(x=>x&&typeof x.n==='string'&&x.n.trim()&&Number.isSafeInteger(x.c)))throw Error('invalid');if(!confirm('לשחזר '+data.items.length+' תנועות? השחזור יחליף את הרשימה הנוכחית. מומלץ לגבות אותה תחילה.'))return;const next=data.items.map(x=>({n:x.n,c:x.c}));localStorage.setItem('shopping-v1',JSON.stringify(next));items=next;reset();draw();$('status').textContent='השחזור הצליח';alert('השחזור הצליח')}catch{alert('לא ניתן לשחזר את הקובץ. הנתונים הקיימים לא שונו.')}finally{e.target.value=''}};draw();</script></html>
