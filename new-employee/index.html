or:#6c7e74;font-size:13px}.hide{display:none!important}.success{background:#d7f3e2;color:#13623e;border-radius:11px;padding:13px;margin-top:14px;text-align:center}.err{color:#a52333;min-height:22px}.pill{font-size:13px;color:#427158}.demo-card{border:1px solid #e0ebe5;border-radius:12px;padding:15px;margin:11px 0;background:#fbfffc}.actions{display:flex;gap:8px;margin-top:12px}.actions button{border:0;border-radius:9px;padding:10px 14px;background:#dcece4;color:#164933;cursor:pointer}.actions button.danger{background:#ffe5e5;color:#a12b2b}.empty{text-align:center;padding:28px;color:#688578}@media(max-width:430px){.panel{padding:16px}.row{gap:7px}.row input{font-size:15px;padding:11px 7px}.row label{font-size:13px;display:block}.row .ar{display:block;font-size:12px}.dob{grid-template-columns:minmax(0,1fr) 87px}}

<main><section class="panel" id="employeeView"><form id="form" autocomplete="off">
<div class="field"><label for="entryDate"><span>תאריך <b class="req">*</b></span><span class="ar" lang="ar">التاريخ</span></label><input id="entryDate" name="entryDate" type="date" required></div>
<div class="field"><label for="fullName"><span>שם העובד <b class="req">*</b></span><span class="ar" lang="ar">اسم الموظف</span></label><input id="fullName" name="fullName" required maxlength="90"></div>
<div class="field"><label for="identity"><span>תעודת זהות <b class="req">*</b></span><span class="ar" lang="ar">رقم الهوية</span></label><input id="identity" name="identity" inputmode="numeric" pattern="[0-9]{9}" maxlength="9" title="יש להזין 9 ספרות" required></div>
<div class="field"><label for="phone"><span>טלפון <b class="req">*</b></span><span class="ar" lang="ar">رقم الهاتف</span></label><input id="phone" name="phone" type="tel" inputmode="tel" minlength="9" maxlength="17" required></div>
<div class="field"><label for="address"><span>כתובת <b class="req">*</b></span><span class="ar" lang="ar">العنوان</span></label><input id="address" name="address" required maxlength="180"></div>
<div class="field"><label for="birthDate"><span>תאריך לידה <b class="req">*</b></span><span class="ar" lang="ar">تاريخ الميلاد</span></label><div class="dob"><input id="birthDate" name="birthDate" type="date" required><div class="age" id="ageBox">גיל: -<br><span class="muted" lang="ar">العمر</span></div></div></div>
<div class="field"><label for="health"><span>קופת חולים <b class="req">*</b></span><span class="ar" lang="ar">صندوق المرضى</span></label><select id="health" name="health" required><option value="">בחר / اختر</option><option>כללית</option><option>מכבי</option><option>מאוחדת</option><option>לאומית</option><option>אחר</option></select></div>
<div class="field"><label><span>האם יש עיקול? <b class="req">*</b></span><span class="ar" lang="ar">هل يوجد حجز؟</span></label><div class="choice"><label><input type="radio" name="lien" value="כן" required> כן / نعم</label><label><input type="radio" name="lien" value="לא" required> לא / لا</label></div></div>
<p class="note">גרסת הדגמה בלבד. אין להזין תעודת זהות אמיתית. השליחה מתבצעת דרך WhatsApp ודורשת אישור העובד. מספר הזהות לא יישלח במלואו.<br><span lang="ar">نسخة تجريبية فقط. لا تدخل رقم هوية حقيقي. يجب تأكيد الإرسال عبر واتساب.</span></p><button class="primary" type="submit">שלח טופס | إرسال النموذج</button><div id="message" aria-live="polite"></div></form></section>
</main><script>
'use strict';
const $=id=>document.getElementById(id),form=$('form');
function age(date){if(!date)return null;const b=new Date(date+'T12:00:00'),n=new Date();if(!Number.isFinite(+b)||b>n)return null;let a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;return a>=0&&a<120?a:null}
function updateAge(){const a=age($('birthDate').value);$('ageBox').textContent='גיל / العمر: '+(a===null?'-':a)}
$('birthDate').addEventListener('change',updateAge);
const now=new Date(),today=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');$('entryDate').value=today;$('entryDate').max=today;$('birthDate').max=today;
function idValid(v){return /^\d{9}$/.test(v)&&[...v].reduce((s,ch,i)=>{const n=Number(ch)*(i%2+1);return s+(n>9?n-9:n)},0)%10===0}
form.addEventListener('submit',e=>{e.preventDefault();if(!form.reportValidity())return;const v=id=>$(id).value.trim();if(!idValid(v('identity'))||age(v('birthDate'))===null||!/^0[0-9\- ]{8,15}$/.test(v('phone'))){alert('יש לבדוק תעודת זהות, תאריך לידה וטלפון / يرجى التحقق من البيانات');return}
const msg='טופס עובד חדש | نموذج موظف جديد\n'+'שם העובד: '+v('fullName')+'\nתאריך: '+v('entryDate')+'\nתעודת זהות (מוסתרת): *****'+v('identity').slice(-4)+'\nטלפון: '+v('phone')+'\nכתובת: '+v('address')+'\nתאריך לידה: '+v('birthDate')+'\nגיל: '+age(v('birthDate'))+'\nקופת חולים: '+v('health')+'\nהאם יש עיקול?: '+form.elements.lien.value;
const m=$('message');m.replaceChildren();const status=document.createElement('div');status.style.cssText='background:#fff2a8;color:#614b00;padding:17px;border-radius:12px;margin-top:14px;text-align:center;font-weight:bold';status.textContent='הטופס מוכן לשליחה. יש לאשר שליחה בוואטסאפ | النموذج جاهز للإرسال، يرجى التأكيد عبر واتساب';m.append(status);const link=document.createElement('a');link.href='https://wa.me/972545438832?text='+encodeURIComponent(msg);link.target='_blank';link.rel='noopener noreferrer';link.textContent='פתח WhatsApp לשליחה | افتح واتساب للإرسال';link.style.cssText='display:block;background:#25d366;color:white;padding:14px;border-radius:12px;margin-top:12px;text-align:center;font-weight:bold;text-decoration:none';m.append(link);link.click();
});
</script></body></html>
